!
hostname r2
!
debug bgp neighbor-events
debug bgp updates
!
interface r2-eth0
 ipv6 address 2001:db8::2/64
exit
!
! SRv6 underlay reachability: r1 originates ISD/DSD whose Prefix-SID
! lives in 2001:db8:e::/48 (r1's locator).  zebra's NHT has to be able
! to resolve that nexthop before BGP-MUP can program the seg6/seg6local
! install in vrf slice1 - production deployments learn it via IS-IS or
! OSPFv3 SRv6 locator advertisements; topotests carry it as a static
! route in the default vrf, mirroring bgp_srv6l3vpn_to_bgp_vrf*.
ipv6 route 2001:db8:e::/48 2001:db8::1
!
interface r2-eth1
 ip address 10.0.2.1/24
exit
!
router bgp 65002
 bgp router-id 2.2.2.2
 no bgp default ipv4-unicast
 neighbor 2001:db8::1 remote-as 65001
 neighbor 10.0.2.105 remote-as 65003
 !
 address-family ipv4 mup
  neighbor 2001:db8::1 activate
  neighbor 2001:db8::1 route-map MUP_PERMIT in
  neighbor 2001:db8::1 route-map MUP_PERMIT out
  neighbor 10.0.2.105 activate
  neighbor 10.0.2.105 route-map MUP_PERMIT in
  neighbor 10.0.2.105 route-map MUP_PERMIT out
 exit-address-family
 !
 address-family ipv6 mup
  neighbor 2001:db8::1 activate
  neighbor 2001:db8::1 route-map MUP_PERMIT in
  neighbor 2001:db8::1 route-map MUP_PERMIT out
 exit-address-family
exit
!
! Pure receive-only PEs: no `segment` line (so no origination), but
! we still need non-default-vrf bgp instances to declare which RTs
! map received MUP routes into a local vrf table.  Two slices verify
! per-(vrf, afi) install-vrf selection: only slice1 (rt 65001:1)
! imports the T2ST 10.0.0.250 from peer1; slice2 (rt 65001:2)
! imports nothing in this topology.
router bgp 65002 vrf slice1
 bgp router-id 2.2.2.2
 no bgp default ipv4-unicast
 !
 address-family ipv4 mup
  rt import 65001:1
 exit-address-family
exit
!
router bgp 65002 vrf slice2
 bgp router-id 2.2.2.2
 no bgp default ipv4-unicast
 !
 address-family ipv4 mup
  rt import 65001:2
 exit-address-family
exit
!
route-map MUP_PERMIT permit 10
exit
!
