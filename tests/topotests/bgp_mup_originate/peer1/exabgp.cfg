neighbor 10.0.2.1 {
	router-id 10.0.2.105;
	local-address 10.0.2.105;
	local-as 65003;
	peer-as 65002;

	family {
		ipv4 mup;
	}
	announce {
		ipv4 {
			# T1ST: UE prefix 192.168.1.5/32 - endpoint 10.99.0.5
			# falls inside r1's ISD 10.99.0.0/24, so r2 should
			# resolve via the ISD cache and synthesize an
			# End.M.GTP4.E SID per RFC 9433 Section 6.6.
			mup \
			mup-t1st 192.168.1.5/32 rd 100:100 teid 12345 qfi 9 \
			endpoint 10.99.0.5 source 10.0.2.105 \
			next-hop 10.0.2.105 \
			extended-community [ target:65001:1 ];

			# T1ST: UE prefix 192.168.2.5/32 - endpoint 10.123.0.5
			# is NOT covered by any ISD on r2, so resolution must
			# fail and no FIB route should be programmed.
			mup \
			mup-t1st 192.168.2.5/32 rd 100:100 teid 22222 qfi 9 \
			endpoint 10.123.0.5 source 10.0.2.105 \
			next-hop 10.0.2.105 \
			extended-community [ target:65001:1 ];

			# T2ST: GTP-U endpoint 10.0.0.250 - MUP-EC segment
			# id 65001:10 matches r1's DSD, so r2 should resolve
			# via the DSD cache and program H.M.GTP4.D toward
			# the DSD's End.DT4 SID.
			mup \
			mup-t2st 10.0.0.250 rd 100:100 teid 12345/32 \
			next-hop 10.0.2.105 \
			extended-community [ target:65001:1 mup:65001:10 ];

			# T2ST: GTP-U endpoint 10.0.0.99 - MUP-EC segment
			# id 65001:99 has no matching DSD, so resolution must
			# fail and no FIB route should be programmed.
			mup \
			mup-t2st 10.0.0.99 rd 100:100 teid 33333/32 \
			next-hop 10.0.2.105 \
			extended-community [ target:65001:1 mup:65001:99 ];
		}
	}
}
