!
hostname r1
!
debug zebra srv6
debug bgp neighbor-events
debug bgp updates
debug bgp zebra
!
interface r1-eth0
 ipv6 address 2001:db8::1/64
exit
!
! Dummy connected addresses inside slice1 stand in for N3 (gNB)
! reachability - `redistribute connected` (under address-family
! ipv[46] mup) injects them into the SAFI_MUP RIB as locally-
! originated, and `segment interwork` then emits one ISD NLRI per
! such prefix.  The dummy netdev `lo-slice1` is created by the
! topotest's build_topo.
interface lo-slice1 vrf slice1
 ip address 10.99.0.1/24
 ipv6 address 2001:db8:99::1/64
exit
!
segment-routing
 srv6
  locators
   locator default
    prefix 2001:db8:e::/48 block-len 24 node-len 24 func-bits 8
   exit
   ! Second locator drives the per-(vrf, AFI) `sid auto locator NAME`
   ! test below: the IPv6 MUP AF anchors its End.M.GTP6.E SID under
   ! loc-mup-v6 instead of the bgp instance default `default`.
   locator loc-mup-v6
    prefix 2001:db8:f::/48 block-len 24 node-len 24 func-bits 8
   exit
  exit
 exit
exit
!
router bgp 65001
 bgp router-id 1.1.1.1
 no bgp default ipv4-unicast
 neighbor 2001:db8::2 remote-as 65002
 !
 segment-routing srv6
  locator default
 exit
 !
 address-family ipv4 mup
  neighbor 2001:db8::2 activate
  neighbor 2001:db8::2 route-map MUP_PERMIT in
  neighbor 2001:db8::2 route-map MUP_PERMIT out
 exit-address-family
 !
 address-family ipv6 mup
  neighbor 2001:db8::2 activate
  neighbor 2001:db8::2 route-map MUP_PERMIT in
  neighbor 2001:db8::2 route-map MUP_PERMIT out
 exit-address-family
exit
!
! ISD origination on slice1 (interwork): SAFI_MUP RIB locally-
! originated entries (network/redistribute under MUP AF) drive one
! ISD NLRI per non-default prefix.
router bgp 65001 vrf slice1
 bgp router-id 1.1.1.1
 no bgp default ipv4-unicast
 !
 segment-routing srv6
  locator default
 exit
 !
 address-family ipv4 mup
  redistribute connected
  rd 100:100
  rt export 65001:1
  sid auto
  segment interwork
 exit-address-family
 !
 address-family ipv6 mup
  redistribute connected
  rd 200:200
  rt export 65001:2
  sid auto locator loc-mup-v6
  segment interwork
 exit-address-family
exit
!
! DSD origination on slice2 (direct): a single DSD per (vrf, afi)
! is emitted for the configured Address with the given End.DT*
! behavior and Direct-Type Segment Identifier.  Mutually exclusive
! with `segment interwork` on the same (vrf, afi).
router bgp 65001 vrf slice2
 bgp router-id 1.1.1.1
 no bgp default ipv4-unicast
 !
 segment-routing srv6
  locator default
 exit
 !
 address-family ipv4 mup
  rd 300:300
  rt export 65001:1
  sid auto
  segment direct
   address 10.0.0.250
   behavior dt4
   segment-id 65001:10
  exit
 exit-address-family
exit
!
route-map MUP_PERMIT permit 10
exit
!
