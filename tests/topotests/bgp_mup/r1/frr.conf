!
hostname r1
!
debug zebra srv6
debug bgp neighbor-events
debug bgp updates
debug bgp zebra
!
interface r1-eth0
 ipv6 address 2001:db8::1/64
exit
!
! Dummy connected addresses inside slice1 stand in for N3 (gNB)
! reachability — `redistribute connected` (below) pulls them into
! slice1's BGP unicast RIB and `rd|rt|sid mup export` +
! `segment mup export interwork` then leak them into BGP-MUP as
! ISD NLRIs.  The dummy netdev `lo-slice1` is created by the
! topotest's build_topo.
interface lo-slice1 vrf slice1
 ip address 10.99.0.1/24
 ipv6 address 2001:db8:99::1/64
exit
!
segment-routing
 srv6
  locators
   locator default
    prefix 2001:db8:e::/48 block-len 24 node-len 24 func-bits 8
   exit
   ! Second locator drives the per-(vrf, AFI) `sid mup export ...
   ! locator NAME` test below: the IPv6 unicast AF anchors its End.M.GTP6.E
   ! SID under loc-mup-v6 instead of the bgp instance default `default`.
   locator loc-mup-v6
    prefix 2001:db8:f::/48 block-len 24 node-len 24 func-bits 8
   exit
  exit
 exit
exit
!
router bgp 65001
 bgp router-id 1.1.1.1
 no bgp default ipv4-unicast
 neighbor 2001:db8::2 remote-as 65002
 !
 segment-routing srv6
  locator default
 exit
 !
 address-family ipv4 mup
  neighbor 2001:db8::2 activate
  neighbor 2001:db8::2 route-map MUP_PERMIT in
  neighbor 2001:db8::2 route-map MUP_PERMIT out
 exit-address-family
 !
 address-family ipv6 mup
  neighbor 2001:db8::2 activate
  neighbor 2001:db8::2 route-map MUP_PERMIT in
  neighbor 2001:db8::2 route-map MUP_PERMIT out
 exit-address-family
exit
!
! Both ISD and DSD origination follow the L3VPN VRF-leak model: every
! VRF-local MUP knob lives under `address-family ipv[46] unicast` of a
! non-default vrf bgp instance (RFC 8986 Section 4.7-Section 4.8:
! End.DT4/DT6 are vrf-mandatory).  ISD prefixes are leaked from the
! per-vrf unicast RIB; DSD is a single per-(vrf, afi) NLRI whose
! Address defaults to the bgp router-id.
router bgp 65001 vrf slice1
 bgp router-id 1.1.1.1
 no bgp default ipv4-unicast
 !
 segment-routing srv6
  locator default
 exit
 !
 address-family ipv4 unicast
  redistribute connected
  rd mup export 100:100
  rt mup export 65001:1
  sid mup export auto
  segment mup export interwork
  segment mup export direct address 10.0.0.250
  behavior mup export dt4
  ext-community mup export 65001:10
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  rd mup export 200:200
  rt mup export 65001:2
  sid mup export auto locator loc-mup-v6
  segment mup export interwork
 exit-address-family
exit
!
route-map MUP_PERMIT permit 10
exit
!
