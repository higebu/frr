!
hostname r1
!
debug zebra srv6
debug bgp neighbor-events
debug bgp updates
debug bgp zebra
!
interface r1-eth0
 ipv6 address 2001:db8::1/64
exit
!
segment-routing
 srv6
  locators
   locator default
    prefix 2001:db8:e::/64 block-len 40 node-len 24 func-bits 16
   exit
  exit
 exit
exit
!
router bgp 65001
 bgp router-id 1.1.1.1
 no bgp default ipv4-unicast
 neighbor 2001:db8::2 remote-as 65002
 !
 segment-routing srv6
  locator default
 exit
 !
 address-family ipv4 mup
  neighbor 2001:db8::2 activate
  neighbor 2001:db8::2 route-map MUP_PERMIT in
  neighbor 2001:db8::2 route-map MUP_PERMIT out
 exit-address-family
 !
 address-family ipv6 mup
  neighbor 2001:db8::2 activate
  neighbor 2001:db8::2 route-map MUP_PERMIT in
  neighbor 2001:db8::2 route-map MUP_PERMIT out
 exit-address-family
exit
!
! `segment interwork` / `segment direct` only live under a non-default
! vrf bgp instance (RFC 8986 §4.7-§4.8: End.DT4/DT6 are vrf-mandatory).
! The default-vrf instance above carries the BGP-MUP session and
! re-advertises everything to r2.
router bgp 65001 vrf slice1
 bgp router-id 1.1.1.1
 no bgp default ipv4-unicast
 !
 segment-routing srv6
  locator default
 exit
 !
 address-family ipv4 mup
  segment interwork 10.99.0.0/24 rd 100:100 rt 65001:1
  segment direct 10.0.0.250 rd 100:100 rt 65001:1 mup 65001:10 behavior dt4
 exit-address-family
 !
 address-family ipv6 mup
  segment interwork 2001:db8:99::/64 rd 200:200 rt 65001:2
 exit-address-family
exit
!
route-map MUP_PERMIT permit 10
exit
!
