!
hostname r1
!
debug zebra srv6
debug bgp neighbor-events
debug bgp updates
debug bgp zebra
!
interface r1-eth0
 ipv6 address 2001:db8::1/64
exit
!
! Dummy connected addresses inside slice1 stand in for N3 (gNB)
! reachability — `redistribute connected` (below) pulls them into
! slice1's BGP unicast RIB and `rd/rt/sid mup export` then leaks
! them into BGP-MUP as ISD NLRIs.  The dummy netdev `lo-slice1` is
! created by the topotest's build_topo.
interface lo-slice1 vrf slice1
 ip address 10.99.0.1/24
 ipv6 address 2001:db8:99::1/64
exit
!
segment-routing
 srv6
  locators
   locator default
    prefix 2001:db8:e::/48 block-len 24 node-len 24 func-bits 8
   exit
  exit
 exit
exit
!
router bgp 65001
 bgp router-id 1.1.1.1
 no bgp default ipv4-unicast
 neighbor 2001:db8::2 remote-as 65002
 !
 segment-routing srv6
  locator default
 exit
 !
 address-family ipv4 mup
  neighbor 2001:db8::2 activate
  neighbor 2001:db8::2 route-map MUP_PERMIT in
  neighbor 2001:db8::2 route-map MUP_PERMIT out
 exit-address-family
 !
 address-family ipv6 mup
  neighbor 2001:db8::2 activate
  neighbor 2001:db8::2 route-map MUP_PERMIT in
  neighbor 2001:db8::2 route-map MUP_PERMIT out
 exit-address-family
exit
!
! ISD origination follows the L3VPN VRF-leak model: prefixes in the
! per-vrf unicast RIB (network/redistribute/connected/static) are
! leaked into BGP-MUP via `rd/rt/sid mup export`.  ISD prefixes carry
! N3 (gNB) reachability — not UE prefixes (UE prefixes belong to DSD).
! `segment direct` continues to declare DSD origins under the MUP AF.
! Both forms require a non-default vrf bgp instance (RFC 8986 §4.7-§4.8:
! End.DT4/DT6 are vrf-mandatory).  The default-vrf instance above
! carries the BGP-MUP session and re-advertises everything to r2.
router bgp 65001 vrf slice1
 bgp router-id 1.1.1.1
 no bgp default ipv4-unicast
 !
 segment-routing srv6
  locator default
 exit
 !
 address-family ipv4 unicast
  redistribute connected
  rd mup export 100:100
  rt mup export 65001:1
  sid mup export auto
 exit-address-family
 !
 address-family ipv4 mup
  segment direct 10.0.0.250 rd 100:100 rt 65001:1 mup 65001:10 behavior dt4
  ! Second DSD with a distinct RT — drives the import-filter
  ! negative test: r2 only imports 65001:1, so this one must NOT
  ! land in slice1's RIB / FIB.
  segment direct 10.0.0.251 rd 100:100 rt 65001:2 mup 65001:11 behavior dt4
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  rd mup export 200:200
  rt mup export 65001:2
  sid mup export auto
 exit-address-family
exit
!
route-map MUP_PERMIT permit 10
exit
!
